<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BiteBox Cart</title>
    <link rel="icon" type="image/png" href="Images/favicon_f.png" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <nav>
        <!-- Logo -->
        <!-- <h2>Bite<span style="color: red;">Box</span></h2> -->
        <a href="./index.html"
          ><img src="Images/logo_cropped.png" alt="Logo"
        /></a>

        <ul type="none">
          <li><a href="home.html">Home</a></li>
          <li><a href="menu.html">Menu</a></li>
          <li><a href="biteDeals.html">Bite Deals</a></li>
          <li><a href="cart.html">Cart</a></li>
          <li><a href="login.html" target="_blank">Login</a></li>
        </ul>
      </nav>
    </header>

    <section class="cart">
        <h2 id="heads">My Cart</h2>
      <table>
        <thead>
          <tr class="rows">
            <th>Item</th>
            <th class="one">Price</th>
            <th class="one">Quantity</th>
            <th>Total Amount</th>
            <th class="one">Remove</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="items">
              <img src="./Images/Pizza.png" alt="Pizza" />
              <div class="cart-item">
                <h3>Pizza</h3>
                <p>Fresh and full with Corn.</p>
              </div>
            </td>
            <td>₹149</td>
            <td>
              <button>-</button>
              <span> 2 </span>
              <button>+</button>
            </td>
            <td>₹298</td>
            <td>
                <button style="padding: 5% 15%;">❌</button>
            </td>
          </tr>
          <tr>
            <td class="items">
              <img src="./Images/Momos.png" alt="Momos">
              <div class="cart-item">
                <h3>Momos</h3>
                <p>With different Flavours</p>
              </div>
            </td>
            <td>₹99</td>
            <td>
              <button>-</button>
              <span> 1 </span>
              <button>+</button>
            </td>
            <td>₹99</td>
            <td>
                <button style="padding: 5% 15%;">❌</button>
            </td>
          </tr>
          <tr class="pad">
            <td colspan="3">Grand Total</td>
            <td>₹397</td>
            <td>
                <button>Proceed</button>
            </td>
          </tr>
        </tbody>
        <!-- <tfoot></tfoot> -->
      </table>
    </section>
  </body>
</html>
