<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignUp Page</title>
    <link rel="icon" type="image/png" href="Images/favicon_f.png">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://kit.fontawesome.com/b79e57cca8.js" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <nav>
            <!-- Logo -->
            <!-- <h2>Bite<span style="color: red;">Box</span></h2> -->
            <a href="./index.html"><img src="Images/logo_cropped.png" alt="Logo"></a>

            <ul type="none">
                <li><a href="home.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="biteDeals.html">Bite Deals</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li><a href="login.html" target="_blank">Login</a></li>
            </ul>
        </nav>
    </header>

    <section class="auth-container">
        <div class="auth" id="register">
            <h2>SignUp Here</h2>

            <form onsubmit="signUp(event)">
                <input type="text" id="name" placeholder="Enter full name" required>
                <input type="text" id="username" placeholder="Enter Username" required>
                <input type="email" id="email" placeholder="Enter your email" required>
                
                <select id="gender" required class="select">
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>

                <input type="password" id="password1" placeholder="Enter Password" required>
                <input type="password" id="password2" placeholder="Confirm Password" required>
                <button type="submit">SignUp</button>
            </form>

            <h3 id="message"></h3>

            <p>Already have an account? <a href="login.html">Login</a> here</p>
        </div>
    </section>
    
    <script src="./Js/signup.js"></script>
</body>
</html>
